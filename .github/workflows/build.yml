name: build-and-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build codehalter
        # -X main.version stamps the release tag into the binary. It is what
        # --version prints and what the update check compares against; an
        # unstamped build reports "dev" and never offers to update itself.
        #
        # CGO_ENABLED=0 makes the binary static. Nothing here needs cgo, and a
        # dynamically linked one asks for /lib64/ld-linux-x86-64.so.2, which on
        # Alpine is gcompat re-executing the program through the musl loader:
        # /proc/self/exe then names the loader, not codehalter, which is how a
        # self-update once overwrote /lib/ld-musl-x86_64.so.1 (see installTarget).
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o codehalter-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # First job here creates the release; the rest lose the race and get
          # "already exists" (harmless, swallowed). Then each uploads its own
          # asset (distinct names, --clobber so re-runs overwrite) to the one
          # release, so the parallel jobs never collide on creation.
          gh release create "$tag" --title "$tag" --notes "" || true
          # Cover the brief lag before a freshly created release is queryable by tag.
          for _ in 1 2 3 4 5; do gh release view "$tag" >/dev/null 2>&1 && break; sleep 2; done
          gh release upload "$tag" "codehalter-${{ matrix.goos }}-${{ matrix.goarch }}" --clobber