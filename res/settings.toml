# Codehalter settings. Edit, then restart the Zed session.
# This project-local file is checked first; ~/.config/codehalter/settings.toml
# is the machine-wide fallback, used only when a project has no local file.
# Top-level keys must stay ABOVE the [[llm]] tables.

# prewarm = true    # warm the server's prefix cache at session open (default on)
# skills = "inline" # put every language SKILL in the prompt up front (default "auto": defer until first touch)
# update_check = false # never ask GitHub whether a newer release exists (default on, at most once a day)
# format_config = false # stop offering to pin a formatter config for a project that deliberately has none (default on, asked once per session)

[[llm]]
server = "http://localhost:8080"  # host root only, no path
# api_key = "..."                 # if your server needs bearer auth
model = "your-model-id"           # must match /v1/models
parallel = 1                      # max concurrent calls to this server
# context_size = 128000           # required for non-llama.cpp backends
# image_support = true            # for non-llama.cpp vision models
# SAMPLERS ONLY. The two roles may differ in temperature/top_p/max_tokens
# freely (samplers never enter the KV cache key), but they must NOT differ in
# anything the server feeds to its chat template, chat_template_kwargs above
# all. That field re-renders the whole prompt, so the roles get two different
# renderings and every plan -> execute switch lands on the wrong one. Measured
# on one 11.6h session: 35 role switches over 436 calls, one every ~12 calls,
# server prefill 483 tok/s. Identical renderings: 121748 tokens re-evaluated
# across all 35 switches (median 1526 each, 97.4% cached), 4.2 min. Those same
# 35 calls carried 2414262 prompt tokens between them, so re-prefilling each
# from scratch is 83.3 min. Sum, not 35x the median: the switch prompts are
# right-skewed (median 55308, mean 68978, max 136803).
#
# The one thing worth weighing against that is turning reasoning off for
# execute. On a thinking model it is large: 71 min of the same session's decode
# went to execute completions and ~70% of that was reasoning. codehalter already
# takes that win WITHOUT a second rendering: every execute-role phase appends an
# already-closed <think></think> for the model to continue, which suppresses
# reasoning just as completely while leaving every earlier token in place
# (probed on a 13978-token prompt: the kwargs change came back cached=0, the
# append cached=13968). So you do not need this:
#
#   params_execute = { ..., chat_template_kwargs = { enable_thinking = false } }
#
# Reach for it only if this model's reasoning delimiters are not
# <think>/</think>, and then ONLY if this server holds 2+ slots (parallel >= 2),
# so each rendering keeps its own KV cache and the switch stays cheap. On one
# slot the 83 min above is more than the ~50 min it saves. Set it on ONE role,
# never both halfway.
#   vLLM:      works per request; --reasoning-parser qwen3 also puts reasoning
#              in reasoning_content instead of inline <think>. Server-wide
#              equivalent: --default-chat-template-kwargs '{"enable_thinking":false}'.
#   llama.cpp: needs --jinja, or the fallback template has no enable_thinking.
#   Ollama:    substitutes its own template; per-request kwargs cannot work.
#   OpenAI:    rejects the field outright (400 unrecognized_keys).
# codehalter warns once if it goes on the wire and the server reasons anyway.
#
# Qwen3.8 also reads reasoning_effort = "low"|"medium"|"xhigh" (default xhigh)
# from the same table: same rendering cost, same rule.
params_thinking = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 16384 }
params_execute = { temperature = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 8192 }

# More [[llm]] entries fan out subagents. Add purpose = "summary" to one of them
# to move the per-turn summariser off llm[0] as well; without it, summarising
# runs on llm[0] (extending the foreground prefix rather than evicting it).
# [[llm]]
# server = "http://other-server:9001"
# model = "your-larger-model-id"
# purpose = "summary"             # host the per-turn summariser here
# parallel = 3
# params_thinking = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 16384 }
# params_execute = { temperature = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 8192 }
