# Codehalter settings. Edit, then restart the Zed session.
# Machine-wide: move to ~/.config/codehalter/settings.toml (checked first).
# Top-level keys must stay ABOVE the [[llm]] tables.

# prewarm = true    # warm the server's prefix cache at session open (default on)
# skills = "inline" # put every language SKILL in the prompt up front (default "auto": defer until first touch)

[[llm]]
server = "http://localhost:8080"  # host root only, no path
# api_key = "..."                 # if your server needs bearer auth
model = "your-model-id"           # must match /v1/models
# skill_variant = "gemma-4-31b"   # per-model pruned skills (.codehalter/skills/<variant>/),
#                                 # measured by the skill crafter: only the statements THIS
#                                 # model needs. Shipped: gemma-4-31b, qwen3.6-27b. Falls back
#                                 # to the generic SKILL per file; omit for generic skills.
parallel = 1                      # max concurrent calls to this server
# context_size = 128000           # required for non-llama.cpp backends
# image_support = true            # for non-llama.cpp vision models
# SAMPLERS ONLY. The two roles may differ in temperature/top_p/max_tokens freely
# (samplers never enter the KV cache key), but they must NOT differ in anything
# the server feeds to its chat template — chat_template_kwargs above all. That
# field re-renders the whole prompt, so a role switch mid-turn (plan → execute)
# throws away the prefix cache: measured at 9088 of 14436 tokens re-evaluated,
# 15s, on one turn. Reasoning is switched off for execute in the message text
# instead (the model's /no_think soft switch), which costs nothing.
params_thinking = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 16384 }
params_execute = { temperature = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 8192 }

# More [[llm]] entries fan out subagents. Add purpose = "summary" to one of them
# to move the per-turn summariser off llm[0] as well — without it, summarising
# runs on llm[0] (extending the foreground prefix rather than evicting it).
# [[llm]]
# server = "http://other-server:9001"
# model = "your-larger-model-id"
# purpose = "summary"             # host the per-turn summariser here
# parallel = 3
# params_thinking = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 16384 }
# params_execute = { temperature = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 8192 }

# purpose = "improve" hosts /improve turns on a stronger (slower) model —
# /improve analyses the day's session logs and can run overnight, so speed does
# not matter and llm[0]'s KV cache stays untouched. During the run, /improve's
# probe_statement tool still calls llm[0] itself: statements are A/B-tested on
# the model the prompts actually serve, not on the analyst.
# [[llm]]
# server = "http://other-server:9001"
# model = "your-strongest-model-id"
# purpose = "improve"             # host /improve analysis here
# params_thinking = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 16384 }
# params_execute = { temperature = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, max_tokens = 8192 }
